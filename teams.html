<!doctype html>
<html lang="en" data-page="teams.html" data-base="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams · Mountainside PAL Basketball</title>
  <meta name="description" content="Mountainside PAL Basketball teams, grades 3 through 8 — coaches, schedules and rosters.">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="./assets/favicon.png">
</head>
<body>

<div id="site-header"></div>
<div id="alert-banner"></div>

<main>
  <section class="hero" style="padding:40px 0 44px">
    <div class="wrap">
      <h1 style="margin-bottom:.2em">Teams</h1>
      <p style="margin-bottom:0">Teams by grade, 3rd through 8th. Pick a team for its coaches,
        schedule and roster.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid grid--3" id="teamGrid"></div>
      <p style="margin-top:26px; color:var(--muted); font-size:.9rem">
        Rosters require a sign-in — that keeps players' names out of public search results.
        <a href="./login.html">Sign in</a> with any Google account to view them.
      </p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module">
import { isConfigured } from "./js/firebase-config.js";
import { GRADES, gradeLabel, teamIdForGrade, teamName, byGrade,
         listTeams, listEvents, parseLocal } from "./js/events.js";

const grid = document.getElementById("teamGrid");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Static shell: assume one team per grade so the page is useful with no backend.
// Firestore is the real source of truth and may have several teams in a grade.
grid.innerHTML = GRADES
  .map(g => ({ id: teamIdForGrade(g), grade: g, label: "" }))
  .map(t => card(t, null))
  .join("");

if (isConfigured) hydrate();

async function hydrate() {
  try {
    const [teams, events] = await Promise.all([listTeams(), listEvents()]);
    if (!teams.length) return;

    const now = Date.now();
    const next = {};
    for (const ev of events) {
      const d = parseLocal(ev.startAt);
      if (!d || d.getTime() < now || ev.status === "cancelled") continue;
      if (!next[ev.teamId] || d < next[ev.teamId].d) next[ev.teamId] = { d, ev };
    }

    grid.innerHTML = byGrade(teams)
      .flatMap(g => g.teams.map(t => card(t, next[t.id])))
      .join("");
  } catch (err) {
    console.warn("[teams] live data unavailable:", err.message);
  }
}

function card(team, next) {
  const sub = next
    ? `Next: ${next.d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}`
    : "Team page";
  const suffix = team.grade === 3 ? "rd" : "th";
  return `
    <a class="teamcard" href="./team.html?id=${esc(team.id)}">
      <div class="grade">${team.grade}<span style="font-size:1rem">${suffix}</span>${
        team.label ? `<span style="font-size:1.1rem;margin-left:6px">${esc(team.label)}</span>` : ""}</div>
      <div class="name">${esc(teamName(team) || gradeLabel(team.grade))}</div>
      <div class="sub">${esc(sub)}</div>
    </a>`;
}
</script>
<script type="module" src="./js/nav.js"></script>
</body>
</html>
