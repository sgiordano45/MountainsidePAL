<!doctype html>
<html lang="en" data-page="login.html" data-base="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Mountainside PAL Basketball</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="./assets/favicon.png">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap">
    <div id="mount"><p class="empty">Loading…</p></div>
  </div>
</main>

<div id="site-footer"></div>

<script type="module">
import { isConfigured } from "./js/firebase-config.js";
import { onAuthChange, signInWithGoogle, signOutUser, isAdmin, loadProfile,
         setupNoticeHTML, explainAuthError, completeRedirectSignIn } from "./js/auth.js";

const mount = document.getElementById("mount");

function showError(err) {
  const box = document.getElementById("authErr");
  if (box) box.innerHTML = `<div class="msg msg--err" style="text-align:left">${
    explainAuthError(err)}</div>`;
  console.error("[auth]", err);
}

if (!isConfigured) {
  mount.innerHTML = setupNoticeHTML();
} else {
  onAuthChange(async (user) => {
    if (!user) {
      mount.innerHTML = `
        <div class="auth-gate">
          <h1>Sign In</h1>
          <p class="lede" style="margin:0 auto 1.6em">
            Signing in lets you view team rosters. Coaches and administrators get
            editing tools.
          </p>
          <button class="btn btn--primary btn--lg" id="in">Sign in with Google</button>
          <div id="authErr" style="margin-top:18px"></div>
        </div>`;
      document.getElementById("in").onclick = (e) => {
        e.target.disabled = true;
        document.getElementById("authErr").innerHTML = "";
        signInWithGoogle()
          .catch(showError)
          .finally(() => { e.target.disabled = false; });
      };
      // pick up a result if we came back from the redirect flow
      completeRedirectSignIn().then(r => { if (r?.error) showError(r.error); });
      return;
    }

    const profile = await loadProfile(user);
    const admin = isAdmin(user, profile);
    const role  = profile?.role || "parent";
    const isCoach = role === "coach";

    // Role label, not the raw database value — "parent" is our word, not theirs.
    const badge = admin ? ["game", "Administrator"]
                : isCoach ? ["tryout", "Coach"]
                : ["practice", "Signed in"];

    mount.innerHTML = `
      <div class="auth-gate">
        <h1>You're signed in</h1>
        <p class="lede" style="margin:0 auto 1em">
          ${user.displayName || user.email}
        </p>
        <p style="margin:-4px 0 22px">
          <span class="badge badge--${badge[0]}">${badge[1]}</span>
        </p>

        <p style="color:var(--ink-soft);margin-bottom:1.6em">
          ${admin || isCoach
            ? "You have editing access to the admin tools."
            : "You can now view team rosters. Rosters are hidden from the public so players' names stay out of search results."}
        </p>

        <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          ${admin || isCoach
            ? '<a class="btn btn--primary" href="./admin/">Go to admin tools</a>' : ""}
          <a class="btn ${admin || isCoach ? "btn--ghost" : "btn--primary"}" href="./teams.html">
            View teams
          </a>
        </p>

        ${admin ? `
        <details style="margin-top:26px;text-align:left">
          <summary style="cursor:pointer;color:var(--muted);font-size:.85rem">
            Account details
          </summary>
          <div class="card" style="margin-top:10px">
            <div class="field" style="margin-bottom:0">
              <label>Your Firebase UID</label>
              <input type="text" id="uid" readonly value="${user.uid}"
                     onclick="this.select()" style="font-family:ui-monospace,monospace">
              <span class="hint">
                Only needed for the bootstrap admin list in
                <code>js/auth.js</code> and <code>firestore.rules</code>.
                Everyone else gets their role from the People page.
              </span>
            </div>
          </div>
        </details>` : ""}

        <p style="margin-top:26px">
          <button class="btn btn--ghost btn--sm" id="out">Sign out</button>
        </p>
      </div>`;
    document.getElementById("out").onclick = () => signOutUser();
  });
}
</script>
<script type="module" src="./js/nav.js"></script>
</body>
</html>
